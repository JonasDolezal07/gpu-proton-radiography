[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prad"
version = "0.3.1"
description = "GPU-accelerated proton radiography"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "Pillow>=9.0",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7", "h5py"]

[tool.setuptools.packages.find]
where = ["."]
include = ["prad*"]

[tool.setuptools.package-data]
prad = ["py.typed", "bin/*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: test requires the release binary and a working Vulkan device",
    "slow: test takes more than ~10 s to run",
]
